<style>.surface-layout{max-width:1310px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin:26px auto;padding:0 20px}.surface-preview.bg-white{background:#fff}.surface-preview.bg-checker{background-color:#fff;background-image:linear-gradient(45deg,#e8ece9 25%,transparent 25%),linear-gradient(-45deg,#e8ece9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8ece9 75%),linear-gradient(-45deg,transparent 75%,#e8ece9 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.surface-preview.bg-dark{background:#223129}.surface-preview{height:min(75vh,730px);min-height:470px;border-radius:16px;overflow:hidden;position:relative;background-color:#fff;background-image:linear-gradient(45deg,#e8ece9 25%,transparent 25%),linear-gradient(-45deg,#e8ece9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8ece9 75%),linear-gradient(-45deg,transparent 75%,#e8ece9 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}#surface-view,#surface-view canvas{height:100%;width:100%;display:block}#surface-view{touch-action:none}.controls{padding:24px;background:white;border:1px solid #dae7da;border-radius:20px;height:max-content}.controls p{font-size:12px;line-height:1.8;color:#627767}.controls label{font-size:12px;display:block;font-weight:700;margin:17px 0 7px}.controls select,.controls button{width:100%;padding:12px;border:1px solid #c9dfc2;border-radius:11px;background:#f3f9f0;color:#245d39}.controls button{margin:5px 0;cursor:pointer}.controls button.active{background:#d2eebd;border-color:#8ec36c}.controls button.primary{background:#226c3c;color:white}.status{background:transparent;border:none;color:#55755d;font-size:11px}.beta{display:inline-block;color:#744600;background:#fff1d5;padding:5px 9px;border-radius:8px;font-size:11px}@media(max-width:850px){.surface-layout{display:block;padding:0 11px;margin:13px auto}.surface-preview{height:56vh;min-height:390px}.controls{margin-top:12px}}</style></head>
<body><header class="topbar"><div class="brand"><div class="logo">◈</div><div><strong>拜爾 Bio · 曲面母版</strong><small>Surface Mesh Beta · 連續曲面與骨架蒙皮</small></div></div><div class="topright"><a href="./index.html">返回原版</a></div></header>
<main class="surface-layout"><section class="stage"><div class="stage-top"><div><span class="eyebrow">SHAPE STUDY / SURFACE MASTER</span><h1>拜爾曲面母版 Beta</h1><p>改用連續曲面建立頭殼、安全帽與身體；手臂由真正骨骼與蒙皮權重控制。</p></div></div><div class="surface-preview bg-white"><div id="surface-view"></div></div><div class="stage-bottom"><span id="surface-status">正在載入…</span><span>可使用拖曳或觸控旋轉</span></div></section>
<aside class="controls"><span class="beta">外型測試版，尚非最終原畫母版</span><h2 style="margin-top:16px">模型控制</h2><p>這個版本改善幾何表面與輪廓，但仍需要以原畫正、側、背面描線進行校正。可切換姿勢並輸出透明 PNG，和原版比較。</p>
<label>骨架姿勢</label><button data-pose="formal" class="active">正式站姿</button><button data-pose="welcome">右手歡迎招呼</button>
<label for="expression">表情</label><select id="expression"><option value="smile">親切微笑</option><option value="happy">開心</option><option value="alert">警示</option></select>
<label for="angle">視角</label><select id="angle"><option value="front">正面</option><option value="three">3/4</option><option value="side">側面</option><option value="back">背面</option></select><button id="recenter" type="button">↺ 重新置中並完整顯示</button>
<label for="background-choice">預覽背景（不影響 PNG 透明度）</label><select id="background-choice"><option value="white">白色（對照原圖）</option><option value="checker">透明棋盤格</option><option value="dark">深綠色</option></select>
<label for="resolution">匯出 PNG 尺寸</label><select id="resolution"><option value="1024">1024 × 1024</option><option value="2048" selected>2048 × 2048</option></select>
<button class="primary" id="download">下載透明背景 PNG</button><p>透明 PNG 只含角色、不含棋盤格。原版：<a href="./index.html">3D Studio</a>；骨架驗證：<a href="./rig-preview.html">Rig Lab</a>。</p></aside></main>
<script type="module" src="./surface-preview.js"></script></body></html>
