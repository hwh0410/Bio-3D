<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio Rig Lab v1 · 骨架與蒙皮技術測試</title><link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<style>.rig-layout{max-width:1250px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;margin:25px auto;padding:0 18px}.lab-view{position:relative;height:min(75vh,720px);min-height:470px;background:repeating-conic-gradient(#eef2ea 0% 25%,#fff 0% 50%) 50%/28px 28px;border-radius:16px;overflow:hidden}#rig-view{width:100%;height:100%;touch-action:none}.lab-tools{background:#fff;padding:24px;border:1px solid #dce7da;border-radius:18px}.lab-tools p{font-size:12px;line-height:1.75;color:#607367}.lab-tools label{font-size:12px;font-weight:700;display:block;margin:18px 0 7px}.lab-tools button,.lab-tools select{width:100%;padding:11px;border:1px solid #c7dfc2;border-radius:10px;background:#eef8e7;color:#235633}.lab-tools button{margin:6px 0;cursor:pointer}#rig-status{font-size:12px;color:#59725d;margin-top:16px} .lab-badge{display:inline-block;padding:6px 10px;background:#fff0d3;color:#7d4b00;border-radius:10px;font-size:11px}@media(max-width:800px){.rig-layout{display:block}.lab-view{min-height:430px;height:54vh}.lab-tools{margin-top:16px}}</style></head>
<body><header class="topbar"><div class="brand"><div class="logo">◈</div><div><strong>拜爾 Bio · Rig Lab</strong><small>骨架 + 蒙皮技術測試</small></div></div><div class="topright"><a href="./index.html">返回正式預覽 ↗</a></div></header>
<main class="rig-layout"><section class="stage"><div class="stage-top"><div><span class="eyebrow">SKINNING PROTOTYPE</span><h1>Bio Rig v1 測試場</h1><p>這是手臂蒙皮原理驗證，不是正式精修母版。旋轉模型檢視彎曲效果。</p></div></div><div class="lab-view"><div id="rig-view"></div></div><div class="stage-bottom"><span id="rig-status">建立蒙皮骨架中…</span><span>網格蒙皮 + 骨骼旋轉測試</span></div></section>
<aside class="lab-tools"><span class="lab-badge">Prototype · 非正式母版</span><h2 style="margin-top:17px">骨骼姿勢</h2><p>左右手臂是真正的 SkinnedMesh，可在肘部權重過渡區變形。頭、帽與腳仍為外型佔位；精修 3D 表皮、UV 與表情在母版階段完成。</p>
<button data-pose="formal">正式站姿</button><button data-pose="welcome">右手招呼</button><button data-pose="inspect">雙手巡檢（測試）</button>
<label for="rig-angle">視角</label><select id="rig-angle"><option value="front">正面</option><option value="three">3/4</option><option value="side">側面</option><option value="back">背面</option></select>
<button id="rig-export" style="background:#286d43;color:white;margin-top:20px">下載透明背景 PNG</button>
<p>建模基準請見 <a href="https://github.com/hwh0410/Bio-3D/blob/main/docs/BIO_RIG_V1_SPEC.md">Rig v1 技術規格</a>。這個頁面只測試架構，正式 GLB 將在造型比對通過後替換。</p></aside></main>
<script type="module" src="./rig-preview.js"></script></body></html>
